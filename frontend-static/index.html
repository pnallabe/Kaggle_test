<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Analyst MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-chart-line text-2xl"></i>
                    <h1 class="text-xl font-bold">AI Data Analyst MVP</h1>
                </div>
                <div class="flex space-x-4">
                    <a href="#" class="hover:text-blue-200">Dashboard</a>
                    <a href="#" class="hover:text-blue-200">Projects</a>
                    <a href="#" class="hover:text-blue-200">Analytics</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8" x-data="dashboardData()">
        <!-- Status Banner -->
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
            <div class="flex items-center">
                <i class="fas fa-check-circle mr-2"></i>
                <span class="font-medium">MVP Deployment Successful!</span>
                <span class="ml-2">API is running and healthy.</span>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-project-diagram"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Active Projects</p>
                        <p class="text-2xl font-semibold" x-text="stats.projects"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Analysis Jobs</p>
                        <p class="text-2xl font-semibold" x-text="stats.jobs"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-database"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Data Sources</p>
                        <p class="text-2xl font-semibold" x-text="stats.dataSources"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Active Users</p>
                        <p class="text-2xl font-semibold" x-text="stats.users"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- API Testing Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-code mr-2 text-blue-600"></i>
                API Testing
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button @click="testEndpoint('/health')" 
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center justify-center">
                    <i class="fas fa-heartbeat mr-2"></i>
                    Test Health Check
                </button>
                
                <button @click="testEndpoint('/api/v1/projects')" 
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg flex items-center justify-center">
                    <i class="fas fa-list mr-2"></i>
                    List Projects
                </button>
                
                <button @click="createJob()" 
                        class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i>
                    Create Analysis Job
                </button>
                
                <button @click="getJobStatus('sample_job_123')" 
                        class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg flex items-center justify-center">
                    <i class="fas fa-search mr-2"></i>
                    Check Job Status
                </button>
            </div>
        </div>

        <!-- Recent Projects -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-folder mr-2 text-blue-600"></i>
                Recent Projects
            </h2>
            
            <div class="space-y-4">
                <template x-for="project in projects" :key="project.id">
                    <div class="border border-gray-200 rounded-lg p-4 hover:bg-gray-50">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-medium" x-text="project.name"></h3>
                                <p class="text-sm text-gray-500" x-text="project.description"></p>
                                <p class="text-xs text-gray-400" x-text="'Created: ' + project.created_at"></p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full" 
                                      x-text="project.status"></span>
                                <button class="text-blue-600 hover:text-blue-800">
                                    <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- API Response Display -->
        <div x-show="apiResponse" class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center">
                <i class="fas fa-terminal mr-2 text-green-600"></i>
                API Response
            </h2>
            <pre class="bg-gray-100 p-4 rounded-lg overflow-x-auto text-sm" x-text="apiResponse"></pre>
        </div>
    </div>

    <script>
        function dashboardData() {
            return {
                stats: {
                    projects: 2,
                    jobs: 8,
                    dataSources: 3,
                    users: 5
                },
                projects: [],
                apiResponse: '',
                
                async init() {
                    await this.loadProjects();
                },
                
                async loadProjects() {
                    try {
                        const response = await fetch('/api/v1/projects');
                        if (response.ok) {
                            const data = await response.json();
                            this.projects = data.projects || [];
                        }
                    } catch (error) {
                        console.error('Failed to load projects:', error);
                        // Fallback data
                        this.projects = [
                            {
                                id: 'sample_project_1',
                                name: 'Sample E-commerce Analysis',
                                description: 'Customer behavior analysis for e-commerce data',
                                created_at: '2025-10-30T10:00:00Z',
                                status: 'active'
                            },
                            {
                                id: 'sample_project_2',
                                name: 'Sales Performance Dashboard',
                                description: 'Real-time sales metrics and KPI tracking',
                                created_at: '2025-10-30T09:30:00Z',
                                status: 'active'
                            }
                        ];
                    }
                },
                
                async testEndpoint(endpoint) {
                    try {
                        const response = await fetch(endpoint);
                        const data = await response.json();
                        this.apiResponse = JSON.stringify(data, null, 2);
                    } catch (error) {
                        this.apiResponse = `Error: ${error.message}`;
                    }
                },
                
                async createJob() {
                    try {
                        const jobData = {
                            project_id: "sample_project_1",
                            user_id: "demo_user",
                            question: "What are the top products by revenue?",
                            dataset_refs: [
                                {"type": "bigquery", "dataset": "demo.sales_data"}
                            ]
                        };
                        
                        const response = await fetch('/api/v1/jobs', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(jobData)
                        });
                        
                        const data = await response.json();
                        this.apiResponse = JSON.stringify(data, null, 2);
                    } catch (error) {
                        this.apiResponse = `Error: ${error.message}`;
                    }
                },
                
                async getJobStatus(jobId) {
                    try {
                        const response = await fetch(`/api/v1/jobs/${jobId}`);
                        const data = await response.json();
                        this.apiResponse = JSON.stringify(data, null, 2);
                    } catch (error) {
                        this.apiResponse = `Error: ${error.message}`;
                    }
                }
            }
        }
    </script>
</body>
</html>
