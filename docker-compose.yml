version: '3.8'

services:
  # AI Data Analyst API
  ai-analyst-api:
    build:
      context: ./mvp-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PROJECT_ID=ai-data-analyst-local
      - REGION=local
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ai_analyst
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=ai_analyst
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (placeholder)
  ai-analyst-frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend-static:/usr/share/nginx/html
    depends_on:
      - ai-analyst-api

volumes:
  postgres_data:
  redis_data: