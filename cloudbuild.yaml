steps:
  # Step 1: Run tests
  - name: 'python:3.11'
    entrypoint: pip
    args: ['install', '-r', 'api/requirements.txt']
  
  - name: 'python:3.11'
    dir: api
    entrypoint: python
    args: ['-m', 'pytest', 'tests/', '-v', '--tb=short']

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:latest'
      - '-f'
      - 'api/Dockerfile'
      - 'api/'

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:${SHORT_SHA}'

  # Step 4: Deploy to Cloud Run (staging)
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - --filename=infra/
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:${SHORT_SHA}
      - --location=${_REGION}
      - --cluster=ai-analyst-cluster

  # Step 5: Deploy to Cloud Run (production)
  - name: 'gcr.io/cloud-builders/run'
    args:
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-traffic

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/api:latest'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'docker-repo'
  _SERVICE_NAME: 'ai-data-analyst'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '3600s'
